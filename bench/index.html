<!doctype html>
<!-- Benchmark for PulsingDotStyleImage. Serve ~/Code/maplibre (the parent of this repo and
     maplibre-gl-js) and open with ?maplibre=npm or ?maplibre=local to pick the build.
     Build ./plugins.mjs first: npx esbuild src/index.ts --bundle --format=esm --external:maplibre-gl --outfile=bench/plugins.mjs -->
<html>
    <head>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="/maplibre-image-plugins/node_modules/maplibre-gl/dist/maplibre-gl.css" />
        <style>
            html,
            body,
            #map {
                margin: 0;
                height: 100%;
            }
        </style>
        <script>
            const builds = {
                npm: '/maplibre-image-plugins/node_modules/maplibre-gl/dist/maplibre-gl-dev.mjs',
                local: '/maplibre-gl-js/dist/maplibre-gl-dev.mjs',
            };
            const build = new URLSearchParams(location.search).get('maplibre') ?? 'local';
            const importmap = document.createElement('script');
            importmap.type = 'importmap';
            importmap.textContent = JSON.stringify({imports: {'maplibre-gl': builds[build]}});
            document.head.append(importmap);
        </script>
        <script type="module" src="./bench.js"></script>
    </head>
    <body>
        <div id="map"></div>
    </body>
</html>
